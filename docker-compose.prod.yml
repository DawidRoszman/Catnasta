# Production stack. Nothing is published on the host: the frontend is the only
# entry point and reaches the API internally; the API and MongoDB sit on an
# internal network with no route in or out.
#
#   cp .env.example .env   # then fill in the secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml --profile tunnel up -d --build   # with Cloudflare Tunnel
name: catnasta-prod

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      DB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/catnasta?authSource=admin
      TOKEN_SECRET: ${TOKEN_SECRET:?set TOKEN_SECRET in .env}
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: /api
        API_INTERNAL_URL: http://api:5001
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Server-side rendering calls the API directly over the internal network.
      API_URL: http://api:5001
    networks:
      - backend
      - edge
    # Only needed if cloudflared (or another proxy) runs on the host instead of
    # in this stack; keeps the port bound to localhost.
    # ports:
    #   - "127.0.0.1:3000:3000"

  # Optional Cloudflare Tunnel. It dials out to Cloudflare, so no inbound port
  # is needed. In the Cloudflare dashboard point the tunnel's public hostname
  # at http://frontend:3000.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - edge

networks:
  # No external connectivity: only the frontend can reach the API and MongoDB.
  backend:
    internal: true
  # The frontend and the tunnel; has outbound internet for cloudflared.
  edge: {}

volumes:
  mongo_data:

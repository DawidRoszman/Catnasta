# Production stack for Dokploy. Nothing is published on the host: Dokploy's
# Traefik reaches the frontend over dokploy-network, the frontend proxies /api
# and /ws to the API internally, and the API and MongoDB sit on an internal
# network with no route in or out.
#
# In Dokploy: Compose path = docker-compose.prod.yml, set the variables from
# .env.example in the Environment tab, then add a domain for service
# "frontend" on port 3000.
name: catnasta-prod

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?set MONGO_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      DB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/catnasta?authSource=admin
      TOKEN_SECRET: ${TOKEN_SECRET:?set TOKEN_SECRET in .env}
    networks:
      backend:
        # Unique name so it can't collide with other apps' "api" services that
        # the frontend also sees on dokploy-network.
        aliases:
          - catnasta-api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: /api
        API_INTERNAL_URL: http://catnasta-api:5001
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Server-side rendering calls the API directly over the internal network.
      API_URL: http://catnasta-api:5001
    expose:
      - "3000"
    networks:
      - backend
      - dokploy-network

networks:
  # No external connectivity: only the frontend can reach the API and MongoDB.
  backend:
    internal: true
  # Dokploy's shared network, where its Traefik routes your domain from.
  dokploy-network:
    external: true

volumes:
  mongo_data:

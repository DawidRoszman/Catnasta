# Registers a fresh user and leaves the browser on the home page, signed in.
url: http://localhost:3000
---
- runScript: ../scripts/newUser.js
- openLink: ${BASE_URL}/register
- assertVisible: "Join the table"
- tapOn:
    id: "username"
- inputText: ${output.username}
- tapOn:
    id: "password"
- inputText: ${output.password}
- tapOn:
    text: "Create account"
    index: 0
- extendedWaitUntil:
    visible: ${"Welcome to Catnasta, " + output.username + "!"}
    timeout: 10000
- assertVisible:
    id: "account-menu"

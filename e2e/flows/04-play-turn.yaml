url: http://localhost:3000
name: Join a table and play a turn on the 3D board
---
- launchApp:
    clearState: true
- openLink: ${BASE_URL}
- runFlow: ../subflows/register.yaml
- runFlow: ../subflows/join-opponent-table.yaml

- assertVisible:
    id: "game-canvas"
- assertVisible: ${output.tableCode}
- assertVisible: ${output.opponent}
- assertNotVisible: "Waiting for an opponent"

# Who starts is random and the API opponent never moves, so deal fresh tables
# until we get the first turn.
- repeat:
    while:
      notVisible: "Your turn — draw from the stock or take the discard pile"
    times: 8
    commands:
      - assertVisible: ${"Waiting for " + output.opponent + " to come back…"}
      - runFlow: ../subflows/join-opponent-table.yaml

- assertVisible: "Your turn — draw from the stock or take the discard pile"
# No melds yet, so the discard pile can't be taken and doesn't light up.
- assertVisible:
    id: "take-pile"
    enabled: false
- takeScreenshot: play-turn-1-draw
- assertVisible:
    id: "round-number"
- assertVisible: "Round 1"
- tapOn: "Draw"
# Nothing banked yet, so the first melds need the opening 30 points.
- assertVisible: "Your first melds need 30 points — or just discard"

# Click a card in the middle of the fanned hand on the 3D table.
- tapOn:
    point: "50%,80%"
- assertVisible: "1 selected"
- takeScreenshot: play-turn-2-selected
- tapOn: "Discard"
- extendedWaitUntil:
    visible: ${"Waiting for " + output.opponent + " to come back…"}
    timeout: 10000
- assertNotVisible: "1 selected"
- takeScreenshot: play-turn-3-discarded

# The rules are one click away during play.
- tapOn:
    id: "rules-button"
- assertVisible: "How to play"
- tapOn: "Got it"
- assertNotVisible: "How to play"

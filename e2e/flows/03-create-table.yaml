url: http://localhost:3000
name: Deal a table and wait for an opponent
---
- launchApp:
    clearState: true
- openLink: ${BASE_URL}
- runFlow: ../subflows/register.yaml
- tapOn:
    id: "create-game"
- assertVisible: "Table options"
- tapOn: "Deal table"
- extendedWaitUntil:
    visible:
      id: "waiting-room"
    timeout: 15000
- assertVisible: "Waiting for an opponent"
- copyTextFrom:
    id: "game-code"
- assertTrue: ${maestro.copiedText.length == 6}
# Stepping away keeps the table open for a while, and the site offers a way back.
- openLink: ${BASE_URL}/game
- assertVisible: "Open tables"
- assertVisible: ${maestro.copiedText}
- assertVisible: "1/2 · seat open"
- extendedWaitUntil:
    visible: "Your table is open"
    timeout: 10000

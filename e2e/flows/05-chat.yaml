url: http://localhost:3000
name: Lobby chat
---
- launchApp:
    clearState: true
- openLink: ${BASE_URL}
- runFlow: ../subflows/register.yaml
- tapOn:
    id: "chat-toggle"
- assertVisible: "Lobby chat"
- tapOn: "Write a message…"
- inputText: ${"Meow from " + output.username}
- pressKey: Enter
- assertVisible: ${"Meow from " + output.username}

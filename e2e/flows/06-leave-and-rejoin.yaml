url: http://localhost:3000
name: Leave, rejoin and forfeit a table
---
- launchApp:
    clearState: true
- openLink: ${BASE_URL}
- runFlow: ../subflows/register.yaml
- runFlow: ../subflows/join-opponent-table.yaml

# The API opponent never opens the table, so they show as away with a countdown.
- extendedWaitUntil:
    visible:
      id: "opponent-away"
    timeout: 10000
- assertVisible: ${output.opponent + " isn't at the table."}

# Stepping away keeps the seat, and the rest of the site offers a way back.
- openLink: ${BASE_URL}
- extendedWaitUntil:
    visible:
      id: "active-game"
    timeout: 10000
- assertVisible: "Your game is still on"
- tapOn: "Return to table"
- extendedWaitUntil:
    visible:
      id: "action-dock"
    timeout: 20000
- assertVisible: ${output.tableCode}

# Leaving from the table asks first, then forfeits. The API opponent forfeits
# once the grace period runs out, so use a fresh table for this part.
- runFlow: ../subflows/join-opponent-table.yaml
- tapOn:
    id: "leave-button"
- assertVisible: "Forfeit the game?"
- tapOn: "Keep playing"
- assertNotVisible: "Forfeit the game?"
- tapOn:
    id: "leave-button"
- tapOn: "Forfeit and leave"
- extendedWaitUntil:
    visible: "Open tables"
    timeout: 10000
# The forfeited table is gone from the lobby and from the "return" banner
# (which may still point at the first table, whose game is running).
- waitForAnimationToEnd
- assertNotVisible: ${".*" + output.tableCode + ".*"}

# A table that hasn't started is simply closed.
- tapOn:
    id: "create-game"
- assertVisible: "Table options"
- tapOn: "Deal table"
- extendedWaitUntil:
    visible:
      id: "waiting-room"
    timeout: 15000
- copyTextFrom:
    id: "game-code"
- tapOn: "Leave"
- assertVisible: "Close this table?"
- tapOn: "Close table"
- extendedWaitUntil:
    visible: "Open tables"
    timeout: 10000
- assertNotVisible: ${maestro.copiedText}
